/* Mobile: keep No. and stock name visible while scrolling; collapse detailed filters by default */
.advanced-toggle{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;color:var(--text);font:inherit;font-size:13px;font-weight:750;cursor:pointer;text-align:left}
.advanced-toggle .toggle-mark{display:inline-block;color:var(--muted);font-size:12px;transition:transform .15s ease}
@media screen and (max-width:600px){
  /* 모바일 가로 스크롤 시 No.와 종목명을 완전히 고정하고, 뒤쪽 셀이 겹치지 않도록 처리 */
  .tablewrap table{min-width:1180px!important;}
  .tablewrap th,.tablewrap td{position:relative;}
  .tablewrap tbody td:nth-child(n+3){z-index:1;background:#fff;background-color:#fff;}
  .tablewrap th:first-child,.tablewrap td:first-child{
    position:sticky!important;left:0!important;
    width:42px!important;min-width:42px!important;max-width:42px!important;
    padding-left:4px!important;padding-right:4px!important;
    background:#fff!important;background-color:#fff!important;
    z-index:100!important;
  }
  .tablewrap th:first-child{background:#f7f9fd!important;z-index:110!important;}
  .tablewrap th:nth-child(2),.tablewrap td:nth-child(2){
    position:sticky!important;left:42px!important;
    width:96px!important;min-width:96px!important;max-width:96px!important;
    padding-left:8px!important;padding-right:6px!important;
    overflow:hidden!important;
    background:#fff!important;background-color:#fff!important;
    box-shadow:1px 0 0 #e4e8f0;
    z-index:99!important;
  }
  .tablewrap th:nth-child(2){
    z-index:109!important;text-align:left;
    background:#f7f9fd!important;background-color:#f7f9fd!important;
  }
  .tablewrap td:nth-child(2){text-align:left;}
  .tablewrap .stock{
    display:block;width:100%;max-width:100%;
    overflow:hidden;white-space:nowrap;text-overflow:clip;
    vertical-align:middle;background:transparent!important;
  }
  .tablewrap tbody tr:hover td:first-child,.tablewrap tbody tr:hover td:nth-child(2){
    background:#f5f8ff!important;background-color:#f5f8ff!important;
  }
}


/* Sticky columns: opaque background so horizontally scrolling cells never overlap No./종목명 */
.tablewrap th:first-child,.tablewrap td:first-child,.tablewrap th:nth-child(2),.tablewrap td:nth-child(2){background-color:#fff;}
.tablewrap th:first-child,.tablewrap th:nth-child(2){background-color:#f7f9fd;}
@media screen and (max-width:900px){
  .advanced-filters{grid-template-columns:repeat(4,minmax(0,1fr));}
}
@media screen and (max-width:700px){
  .advanced-filters{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media screen and (max-width:600px){
  .tablewrap th:first-child,.tablewrap td:first-child{
    background:#fff!important;background-color:#fff!important;
    z-index:30!important;
    box-shadow:2px 0 0 #e4e8f0;
  }
  .tablewrap th:nth-child(2),.tablewrap td:nth-child(2){
    background:#fff!important;background-color:#fff!important;
    z-index:29!important;
    box-shadow:3px 0 7px rgba(23,32,51,.10);
  }
  .tablewrap th:nth-child(2){background:#f7f9fd!important;background-color:#f7f9fd!important;z-index:39!important;}
  .tablewrap tbody td:nth-child(n+3){z-index:1!important;background:#fff!important;background-color:#fff!important;}
}

/* Search emphasis + collapsible filters on all devices */

.field.search input::placeholder{color:#8b96a8;font-weight:400;}
.field.search input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #315efb18;}
.head-count{color:var(--muted);font-weight:500;margin-left:3px;}
